<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Maquetación básica: header, nav, main y footer</title>
<style>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* html y body al 100% para que el layout ocupe toda la ventana */
  html, body {
    height: 100%;
  }

  header, footer {
    width: 100%;
    height: 15%;
    background-color: #555;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 20px;
  }

  footer {
    justify-content: center;
  }

  /* Franja central que contiene nav y main */
  .cuerpo {
    width: 100%;
    height: 70%;
  }

  nav {
    float: left;
    width: 20%;
    height: 100%;
    background-color: #e07b6e;
    padding: 16px;
  }

  nav h2 {
    text-align: center;
    margin-bottom: 10px;
  }

  nav ul {
    list-style: none;
    background-color: #c0c0c0;
    padding: 10px;
  }

  nav li {
    padding: 6px 0;
  }

  nav a {
    color: black;
    text-decoration: none;
  }

  main {
    float: left;
    width: 80%;
    height: 100%;
    background-color: #27ae87;
    color: white;
    padding: 16px;
    overflow: auto;
  }

  .bloqueConPadding {
    background: linear-gradient(to right, navy, dodgerblue);
    padding: 16px;
    margin-top: 16px;
  }

  .bloqueSinPadding {
    background: linear-gradient(to right, navy, dodgerblue);
    margin-top: 16px;
  }

  /* clear:both necesario para que el footer no suba a la derecha de nav */
  .corteFlotacion {
    clear: both;
  }

  main img {
    max-width: 300px;
    display: block;
    margin-top: 16px;
  }

</style>
</head>
<body>

  <header>
    <h1>Encabezado de la página</h1>
  </header>

  <div class="cuerpo">

    <nav>
      <h2>Menú</h2>
      <ul>
        <li><a href="../../../Html/index.html">HTML</a></li>
        <li><a href="../../index.html">CSS</a></li>
      </ul>
    </nav>

    <main>
      <p>Área de contenido principal</p>
      <img src="./monte-fuji-sakura.jpg" alt="Monte Fuji con cerezos">
      <div class="bloqueConPadding">Div con padding.</div>
      <div class="bloqueSinPadding">Div sin padding.</div>
    </main>

    <div class="corteFlotacion"></div>

  </div>

  <footer>
    <p>Pie de página</p>
  </footer>

  <p style="text-align:center;padding:12px;">
    <a href="../../index.html">Volver al índice de Css</a>
  </p>

</body>
</html>
