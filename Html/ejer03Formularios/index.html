<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario con validación HTML5</title>
</head>
<body style="font-family:Arial, sans-serif; margin:20px;">

  <h1>Formulario HTML5</h1>

  <!-- action apunta a la página que muestra los parámetros recibidos por GET -->
  <form action="./respuestaFormulario.html" target="_blank" method="get">

    <h2>Entradas de texto simples</h2>
    <ul>

      <!-- autofocus: el cursor queda aquí al cargar la página -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" value="" autofocus="autofocus">
      </li>

      <!-- type="password" oculta el texto mientras se escribe -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="contrasena">Contraseña:</label><br>
        <input type="password" id="contrasena" name="contrasena" value="">
      </li>

      <!-- campo oculto: se envía pero el usuario no lo ve -->
      <li style="margin-top:10px;">
        <input type="hidden" name="origen" value="formularioEjer03">
      </li>

      <!-- disabled: el campo no se envía ni se puede editar -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="campoDeshabilitado">Campo deshabilitado:</label><br>
        <input type="text" id="campoDeshabilitado" name="campoDeshabilitado" value="no editable" disabled="disabled">
      </li>

      <!-- readonly: el campo se envía pero no se puede editar -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="campoLectura">Campo de solo lectura:</label><br>
        <input type="text" id="campoLectura" name="campoLectura" value="solo lectura" readonly="readonly">
      </li>

    </ul>

    <h2>Entradas de selección</h2>
    <ul>

      <!-- checkboxes: selección múltiple independiente -->
      <li style="margin-top:10px;">
        <input type="checkbox" id="programacion" name="programacion" value="si"> <label for="programacion">Programa habitualmente</label>
      </li>
      <li style="margin-top:10px;">
        <input type="checkbox" id="disenio" name="disenio" value="si"> <label for="disenio">Practica diseño gráfico</label>
      </li>
      <li style="margin-top:10px;">
        <input type="checkbox" id="musica" name="musica" value="si"> <label for="musica">Toca algún instrumento</label>
      </li>

      <!-- radio: selección única dentro del mismo name -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;">Género:</label><br>
        <input type="radio" id="masculino" name="genero" value="masc"> <label for="masculino">Masculino</label>
        <input type="radio" id="femenino" name="genero" value="fem" checked="checked"> <label for="femenino">Femenino</label>
        <input type="radio" id="otro" name="genero" value="otro"> <label for="otro">Otro</label>
      </li>

      <!-- select: lista desplegable con opciones predefinidas -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="nivelEstudios">Nivel de estudios:</label><br>
        <select id="nivelEstudios" name="nivelEstudios">
          <option value="pri" selected="selected">Primario</option>
          <option value="sec">Secundario</option>
          <option value="ter">Terciario</option>
          <option value="uni">Universitario</option>
          <option value="pos">Posgrado</option>
        </select>
      </li>

      <!-- type="date" y type="time": selectores nativos del navegador -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="fechaNac">Fecha de nacimiento:</label><br>
        <input type="date" id="fechaNac" name="fechaNac">
        <input type="time" id="horaNac" name="horaNac">
      </li>

      <!-- type="color": selector de color nativo -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="colorFavorito">Color favorito:</label><br>
        <input type="color" id="colorFavorito" name="colorFavorito">
      </li>

    </ul>

    <h2>Entradas con validación HTML5</h2>
    <ul>

      <!-- required: el navegador bloquea el envío si está vacío -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="consulta">Consulta (campo requerido):</label><br>
        <input type="text" id="consulta" name="consulta" required="required">
      </li>

      <!-- type="email" valida formato x@x, required valida que no esté vacío -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com" required="required">
      </li>

      <!-- type="number" con min y max: el navegador valida el rango -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="calificacion">Calificación (1 a 10):</label><br>
        <input type="number" id="calificacion" name="calificacion" min="1" max="10">
      </li>

      <!-- step="0.5" permite valores con decimales de a 0.5 -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="promedio">Promedio (0 a 10, paso 0.5):</label><br>
        <input type="number" id="promedio" name="promedio" min="0" max="10" step="0.5">
      </li>

      <!-- type="url" exige que el valor comience con un protocolo válido -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="sitioWeb">Sitio web (requiere http://):</label><br>
        <input type="url" id="sitioWeb" name="sitioWeb" placeholder="http://www.ejemplo.com" required="required">
      </li>

      <!-- pattern: expresión regular personalizada; title explica el formato esperado -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="codigo">Código de producto (3 letras + 2 dígitos):</label><br>
        <input type="text" id="codigo" name="codigo" pattern="[a-zA-Z]{3}[0-9]{2}" placeholder="abc12" title="3 letras seguidas de 2 números">
      </li>

      <!-- pattern para teléfono con formato argentino -->
      <li style="margin-top:10px;">
        <label style="font-weight:bold;" for="celular">Celular (formato +54 9 11 XXXXXXXX):</label><br>
        <input type="text" id="celular" name="celular" pattern="\+54 9 11 \d{8}" placeholder="+54 9 11 44445555" title="+54 9 11 xxxxxxxx">
      </li>

    </ul>

    <button type="submit">Enviar</button>
    <button type="reset">Limpiar</button>

  </form>

  <p><a href="../index.html">Volver al índice de Html</a></p>

</body>
</html>
