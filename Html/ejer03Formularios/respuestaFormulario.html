<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Respuesta del formulario</title>
</head>
<body style="font-family:Arial, sans-serif; margin:20px;">

  <h1>Parámetros recibidos</h1>
  <p>Valores enviados por método GET en la URL:</p>

  <!-- Lista donde se inyectan los pares nombre=valor recibidos -->
  <ul id="listaParametros"></ul>

  <script>
    /* Lee los parámetros de la URL y los muestra en la lista */
    var parametros = new URLSearchParams(window.location.search);
    var lista = document.getElementById('listaParametros');

    if ([...parametros].length === 0) {
      lista.innerHTML = '<li>No se recibió ningún parámetro.</li>';
    } else {
      parametros.forEach(function(valor, nombre) {
        var item = document.createElement('li');
        item.textContent = nombre + ' = ' + valor;
        lista.appendChild(item);
      });
    }
  </script>

  <p><a href="./index.html">Volver al formulario</a></p>

</body>
</html>
