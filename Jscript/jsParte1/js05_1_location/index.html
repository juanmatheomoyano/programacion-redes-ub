<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS12 - Location</title>
</head>
<body style="font-family:Arial, sans-serif; margin:20px;">

  <h1>Ejercicio 12: redirección con location</h1>
  <p>Cada botón redirige el navegador a una URL diferente usando location.href.</p>

  <!-- location.href asigna una nueva URL al navegador, redirigiendo la pestaña actual -->
  <button onclick="location.href='https://www.youtube.com'">YouTube</button>
  <button onclick="location.href='https://sourceforge.net'">SourceForge</button>
  <button onclick="location.href='https://mail.google.com'">Gmail</button>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
