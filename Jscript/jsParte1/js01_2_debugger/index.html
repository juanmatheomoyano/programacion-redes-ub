<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>JS02 - Debugger</title>
</head>
<body style="font-family:Arial, sans-serif; margin:40px;">

  <h1>Ejercicio 2: debugger</h1>

  <p>
    Este ejercicio no escribe nada en la página. Los valores se envían a la consola del navegador.
    Abrí las herramientas de desarrollo (F12) y seleccioná la pestaña Consola para verlos.
  </p>

  <script>
    /* Declaración: las variables existen pero todavía no tienen valor (undefined) */
    let x;
    let y;
    let resultado;

    /* Asignación de valores */
    x = 10;
    y = 4;
    resultado = x + y;

    /* console.log envía los valores a la consola de depuración del navegador */
    console.log("Valor de x: " + x);
    console.log("Valor de y: " + y);
    console.log("Resultado de x + y: " + resultado);
  </script>

  <p><a href="../../index.html">Volver al índice de Js</a></p>

</body>
</html>
