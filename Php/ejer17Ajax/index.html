<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejer17 - AJAX con Fetch API</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; color: #222; padding: 40px 24px; }
  h1 { font-size: 1.2em; color: #1b4332; border-bottom: 2px solid #52b788; padding-bottom: 6px; margin-bottom: 20px; }
  .panel { background: white; border: 1px solid #ccc; padding: 24px; max-width: 500px; }
  label { display: block; font-size: 0.88em; font-weight: bold; color: #2d6a4f; margin-bottom: 6px; }
  input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid #ccc; font-size: 0.9em; margin-bottom: 14px; }
  button { background: #2d6a4f; color: white; border: none; padding: 10px 24px; font-size: 0.9em; cursor: pointer; }
  button:hover { background: #1b4332; }
  #divRespuesta { margin-top: 20px; padding: 14px; border: 1px solid #d8f3dc; background: #f4faf6; font-size: 0.88em; min-height: 48px; }
  .hash { font-family: monospace; display: block; margin-top: 6px; word-break: break-all; }
  .volver { display: block; margin-top: 20px; font-size: 0.85em; color: #1b4332; text-decoration: none; }
  .volver:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Ejer17 — AJAX con Fetch API</h1>

<div class="panel">
  <label for="clave">Clave a encriptar:</label>
  <input type="text" id="clave" placeholder="Escribí algo...">
  <button id="btnEncriptar">Encriptar por AJAX</button>

  <!-- El resultado se inyecta aquí de forma asincrónica -->
  <div id="divRespuesta">Esperando acción...</div>
</div>

<a class="volver" href="../index.html">← Volver al índice de PHP</a>

<script>
  document.getElementById("btnEncriptar").addEventListener("click", function() {

    var clave = document.getElementById("clave").value;

    /* Mostrar estado de espera mientras el servidor procesa */
    document.getElementById("divRespuesta").innerHTML = "Esperando respuesta...";

    /* Parámetros enviados por POST con URLSearchParams */
    const data = new URLSearchParams();
    data.append("clave", clave);

    /* Fetch nativo: envía la petición y actualiza el DOM con la respuesta */
    fetch("respuesta.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: data
    })
    .then(function(respuesta) { return respuesta.json(); })
    .then(function(obj) {
      document.getElementById("divRespuesta").innerHTML =
        "MD5: <span class='hash'>" + obj.md5 + "</span>" +
        "SHA1: <span class='hash'>" + obj.sha1 + "</span>";
    })
    .catch(function(error) {
      document.getElementById("divRespuesta").innerHTML = "Error: " + error;
    });

  });
</script>

</body>
</html>
