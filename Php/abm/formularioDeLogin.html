<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso al Sistema — Notas de Crédito</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: Arial, sans-serif;
    background: #1b4332;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tarjeta {
    background: white;
    width: 100%;
    max-width: 380px;
    border-top: 5px solid #52b788;
    box-shadow: 0 10px 32px rgba(0,0,0,0.4);
    padding: 36px 32px 28px;
  }
  .tarjeta h1 {
    font-size: 1.1em;
    color: #1b4332;
    text-align: center;
    margin-bottom: 4px;
  }
  .tarjeta .subtitulo {
    font-size: 0.78em;
    color: #888;
    text-align: center;
    margin-bottom: 28px;
  }
  .campo { margin-bottom: 16px; }
  .campo label {
    display: block;
    font-size: 0.82em;
    font-weight: bold;
    color: #2d6a4f;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .campo input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.2s;
  }
  .campo input:focus { border-color: #52b788; }
  .btn-ingresar {
    width: 100%;
    background: #2d6a4f;
    color: white;
    border: none;
    padding: 11px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s;
  }
  .btn-ingresar:hover { background: #1b4332; }
  #mensajeError {
    background: #fdecea;
    border-left: 4px solid #c0392b;
    color: #c0392b;
    padding: 9px 12px;
    font-size: 0.85em;
    margin-bottom: 18px;
    display: none;
  }
  .pie {
    text-align: center;
    margin-top: 20px;
    font-size: 0.78em;
    color: #aaa;
  }
</style>
</head>
<body>
<div class="tarjeta">
  <h1>Encabezados de Notas de Crédito</h1>
  <p class="subtitulo">Tabla 9 &mdash; Juan Moyano &mdash; UB</p>

  <div id="mensajeError">Usuario o contraseña incorrectos. Intente nuevamente.</div>

  <form method="POST" action="./ingresoAlSistema.php">
    <div class="campo">
      <label for="login">Usuario</label>
      <input type="text" id="login" name="login" autocomplete="username" required autofocus>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-ingresar">Ingresar al Sistema</button>
  </form>

  <p class="pie">Programación en Ambientes de Redes &mdash; Universidad de Belgrano</p>
</div>

<script>
  // Muestra mensaje de error si la URL tiene ?error=1
  if (window.location.search.indexOf('error=1') !== -1) {
    document.getElementById('mensajeError').style.display = 'block';
  }
</script>
</body>
</html>
